name: Publish npm packages
concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Must match your username"
        required: true
        type: choice
        options:
          - notaphplover

permissions:
  contents: write

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Validate environment matches actor
        run: |
          echo "Actor: ${{ github.actor }}"
          echo "Environment: ${{ inputs.environment }}"

          if [ "${{ inputs.environment }}" != "${{ github.actor }}" ]; then
            echo "::error::Environment must match your username"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Publish npm packages
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
