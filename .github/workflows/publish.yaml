name: Publish npm packages
concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Must match your username"
        required: true
        type: choice
        options:
          - notaphplover

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Validate environment matches actor
        run: |
          echo "Actor: ${{ github.actor }}"
          echo "Environment: ${{ inputs.environment }}"

          if [ "${{ inputs.environment }}" != "${{ github.actor }}" ]; then
            echo "::error::Environment must match your username"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          # registry.npmjs.org is already npm's default registry; this does not change where
          # packages are published. actions/setup-node only wires auth when registry-url is set:
          # it writes an .npmrc that maps //registry.npmjs.org/:_authToken to NODE_AUTH_TOKEN.
          # Required because changesets/action@v2 no longer creates that .npmrc from NPM_TOKEN.
          registry-url: https://registry.npmjs.org/

      - name: Publish npm packages
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          publish-script: pnpm run release
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
